name: Terragrunt Deploy Cognito

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT from AWS OIDC
  contents: read  # Required for actions/checkout

jobs:
  plan:
    name: "Terragrunt Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Crucial: allows Terragrunt to parse clean output stream

      # 🟢 Direct binary setup for Terragrunt (No marketplace dependency)
      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION="v0.67.4" # Pins a stable, modern production version
          sudo wget -q -O /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init & Plan
        working-directory: ./cognito
        run: |
          terragrunt init
          terragrunt plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: cognito/tfplan

  apply:
    name: "Terragrunt Apply"
    runs-on: ubuntu-latest
    needs: plan 
    environment: prod 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 🟢 Mirroring direct binary installation in the apply job environment
      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION="v0.67.4"
          sudo wget -q -O /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo chmod +x /usr/local/bin/terragrunt

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: cognito

      - name: Terragrunt Init & Apply
        working-directory: ./cognito
        run: |
          terragrunt init
          terragrunt apply tfplan
