name: Terraform Deploy Cognito

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT from AWS OIDC
  contents: read  # Required for actions/checkout

jobs:
  plan:
    name: "Terragrunt Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Crucial: disables wrapper so Terragrunt can parse outputs cleanly

      - name: Setup Terragrunt
        uses: tnk4on/setup-terragrunt@v2
        with:
          terragrunt-version: latest

      # Move into the directory where your actual infrastructure modules live
      - name: Terragrunt Init & Plan
        working-directory: ./cognito
        run: |
          terragrunt init
          terragrunt plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: cognito/tfplan

  apply:
    name: "Terragrunt Apply"
    runs-on: ubuntu-latest
    needs: plan 
    environment: production 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: tnk4on/setup-terragrunt@v2
        with:
          terragrunt-version: latest

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: cognito

      - name: Terragrunt Init & Apply
        working-directory: ./cognito
        run: |
          terragrunt init
          terragrunt apply tfplan
