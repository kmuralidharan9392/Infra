name: Terragrunt Infrastructure Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT from AWS OIDC
  contents: read  # Required for actions/checkout

jobs:
  plan:
    name: "Terragrunt Plan All"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

       # 🟢 Direct binary setup for Terragrunt (No marketplace dependency)
      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION="v0.67.4" # Pins a stable, modern production version
          sudo wget -q -O /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      # 🟢 Plans all active folders (vpc and cognito) in parallel/sequence automatically
      - name: Terragrunt Plan All
        working-directory: ./prod
        run: |
          terragrunt run-all plan --terragrunt-non-interactive

  apply:
    name: "Terragrunt Apply All"
    runs-on: ubuntu-latest
    needs: plan 
    environment: prod # Triggers your manual review gate in GitHub
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

       # 🟢 Direct binary setup for Terragrunt (No marketplace dependency)
      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION="v0.67.4" # Pins a stable, modern production version
          sudo wget -q -O /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo chmod +x /usr/local/bin/terragrunt
          terragrunt --version
          
      # 🟢 Executes the saved plans concurrently across your active architecture
      - name: Terragrunt Apply All
        working-directory: ./prod
        run: |
          terragrunt run-all apply --terragrunt-non-interactive
